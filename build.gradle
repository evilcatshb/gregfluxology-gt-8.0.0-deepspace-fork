plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.86'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Local libs dir — contains GTCEu dev jar (already in Mojang/parchment mappings)
    flatDir { dirs 'libs' }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = mapping_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        server {
            server()
            programArguments.addAll('--nogui')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        client {
            client()
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
    }
}

mixin {
    // Registers the refmap and wires up the mixin config
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    // GTCEu 8.0.0 dev jar — already in Mojang official mappings, provided at runtime
    // transitive = false: we do NOT bundle GTCEu or its deps in our jar
    compileOnly(files("libs/gtceu-1.20.1-8.0.0-dev.jar"))

    // Mixin annotation processor — required for refmap generation
    annotationProcessor('org.spongepowered:mixin:0.8.7:processor')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mod_id}.mixins.json",
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

// IDEA: auto-download sources/javadoc
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
